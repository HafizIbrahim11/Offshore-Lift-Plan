name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html sketch.html android/app/src/main/assets/
      - name: Load signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/liftplan.keystore"; echo "KEYSTORE_PATH=$RUNNER_TEMP/liftplan.keystore" >> "$GITHUB_ENV"; echo "Signing with your key"; else echo "::warning::No signing key secret yet - building with a temporary test key"; fi
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OffshoreLiftPlan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OffshoreLiftPlan-apk
          path: OffshoreLiftPlan.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Offshore Lift Plan v1.0.${{ github.run_number }}
          body: Install OffshoreLiftPlan.apk on Android. It adds two apps to your phone, Lift Plan and Crane Sketch.
          files: OffshoreLiftPlan.apk
          make_latest: true
